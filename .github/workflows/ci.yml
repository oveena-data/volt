# DevSecOps pipeline: every push/PR runs the full backend test suite against
# a real Postgres, static security analysis (bandit), dependency vulnerability
# audits (pip-audit, npm audit), a secret scan of the tree, and the frontend
# type-checked production build. Nothing deploys from here; releases are
# built from a green main only.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: volt_dev_password
          POSTGRES_DB: volt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U volt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - name: Run test suite (real Postgres, scripted mock model)
        working-directory: backend
        env:
          VOLT_TEST_DATABASE_URL: postgresql://volt:volt_dev_password@127.0.0.1:5432/volt_test
        run: python -m pytest tests/ -q

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static security analysis (bandit)
        run: |
          pip install bandit
          bandit -r backend/app -ll
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock.txt --strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tree and history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check and build
        run: npm run build
      - name: Enforce UI rules (no emoji, Arial only)
        run: |
          if LC_ALL=C grep -rnP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}\x{FE0F}\x{2190}-\x{21FF}\x{2460}-\x{24FF}]' src/ index.html; then
            echo "Emoji or symbol characters found in frontend source" >&2
            exit 1
          fi
