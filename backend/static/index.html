<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VOLT — Prompt Injection Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Substation control-room panel. Signal colours from electrical warning
       lamps: sodium amber = caution/live, steel = structure, verdigris copper
       = the grid itself, fault-red for danger, phosphor for "breach/solved". */
    --bg:#0c1014;
    --panel:#141b22;
    --panel-2:#1b242d;
    --edge:#2a3742;
    --edge-bright:#3b4e5c;
    --steel:#7f98a8;
    --steel-dim:#56697a;
    --amber:#ffb224;      /* live / caution lamp */
    --amber-dim:#8a6417;
    --copper:#4ec9a8;     /* the grid / verdigris */
    --fault:#ff5d52;      /* danger */
    --phosphor:#9cff57;   /* breach achieved */
    --text:#dfe8ef;
    --text-dim:#8296a4;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Space Grotesk',system-ui,sans-serif;
    --r:4px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 75% -10%, #16222b 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.012) 39px 40px),
      var(--bg);
    color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100%}
  a{color:var(--copper);text-decoration:none}
  button{font-family:inherit}
  ::selection{background:var(--amber);color:#1a1205}

  /* ---------- shell ---------- */
  .shell{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
  .topbar{
    display:flex;align-items:center;gap:16px;
    border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:22px;
  }
  .brand{display:flex;align-items:baseline;gap:12px;flex:1;min-width:0}
  .bolt{
    font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:-1px;
    color:var(--bg);background:var(--amber);padding:2px 10px;border-radius:var(--r);
    box-shadow:0 0 0 1px #000 inset, 0 0 24px rgba(255,178,36,.35);
  }
  .brand h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.5px;color:#eef4f8}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--steel-dim)}
  .hud{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px}
  .hud .chip{
    background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);
    padding:6px 10px;color:var(--steel);white-space:nowrap
  }
  .hud .chip b{color:var(--amber);font-weight:700}
  .hud .chip.score b{color:var(--phosphor)}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}

  /* ---------- level rail ---------- */
  .rail{display:flex;flex-direction:column;gap:8px}
  .rail .hdr{font-family:var(--mono);font-size:11px;color:var(--steel-dim);
    padding:0 2px 4px;letter-spacing:1px}
  .lvl{
    text-align:left;width:100%;cursor:pointer;color:var(--text);
    background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);
    padding:11px 12px;display:flex;gap:11px;align-items:center;transition:border-color .12s,background .12s;
  }
  .lvl:hover{border-color:var(--edge-bright);background:var(--panel-2)}
  .lvl.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}
  .lvl .n{
    font-family:var(--mono);font-weight:700;font-size:13px;color:var(--steel);
    width:26px;height:26px;display:grid;place-items:center;flex:none;
    border:1px solid var(--edge-bright);border-radius:var(--r)
  }
  .lvl.cleared .n{color:var(--bg);background:var(--phosphor);border-color:var(--phosphor)}
  .lvl .ttl{font-size:13.5px;line-height:1.2;display:block}
  .lvl .tech{font-family:var(--mono);font-size:10.5px;color:var(--steel-dim);margin-top:3px;display:block}
  .lvl .best{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--phosphor)}

  /* ---------- console ---------- */
  .console{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
  .console .head{
    padding:14px 16px;border-bottom:1px solid var(--edge);
    display:flex;gap:14px;align-items:flex-start;
    background:linear-gradient(180deg,var(--panel-2),var(--panel))
  }
  .console .head .meta{flex:1;min-width:0}
  .console .head .eyebrow{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.5px}
  .console .head h2{margin:3px 0 6px;font-size:20px;font-weight:500}
  .console .head p{margin:0;color:var(--text-dim);font-size:13px;line-height:1.55;max-width:70ch}
  .status-lamp{font-family:var(--mono);font-size:11px;white-space:nowrap;
    border:1px solid var(--edge-bright);border-radius:var(--r);padding:5px 9px;color:var(--steel)}
  .status-lamp.live{color:var(--amber);border-color:var(--amber-dim)}
  .status-lamp.breach{color:var(--bg);background:var(--phosphor);border-color:var(--phosphor);font-weight:700}

  .meters{display:flex;gap:0;border-bottom:1px solid var(--edge);font-family:var(--mono);font-size:12px}
  .meters .m{flex:1;padding:10px 16px;border-right:1px solid var(--edge);color:var(--steel-dim)}
  .meters .m:last-child{border-right:0}
  .meters .m b{display:block;color:var(--text);font-size:16px;font-weight:700;margin-top:2px}
  .meters .m.est b{color:var(--amber)}

  /* chat log */
  .log{height:min(52vh,560px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .log::-webkit-scrollbar{width:9px}
  .log::-webkit-scrollbar-thumb{background:var(--edge-bright);border-radius:9px}
  .msg{max-width:84%;padding:10px 13px;border-radius:var(--r);font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--panel-2);border:1px solid var(--edge-bright)}
  .msg.bot{align-self:flex-start;background:#10171d;border:1px solid var(--edge);border-left:2px solid var(--copper)}
  .msg.block{align-self:center;max-width:92%;background:#1e1414;border:1px solid var(--fault);
    color:#ffc9c4;font-family:var(--mono);font-size:12px}
  .msg.breach{align-self:center;max-width:92%;background:#15200d;border:1px solid var(--phosphor);
    color:var(--phosphor);font-family:var(--mono);font-size:12.5px}
  .msg .who{font-family:var(--mono);font-size:10px;color:var(--steel-dim);margin-bottom:5px;letter-spacing:.5px}

  .empty{margin:auto;text-align:center;color:var(--steel-dim);font-family:var(--mono);font-size:12.5px;line-height:1.7}

  /* fragment tray (L3) */
  .tray{border-top:1px solid var(--edge);padding:9px 16px;font-family:var(--mono);font-size:11.5px;color:var(--steel);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#10171d}
  .tray .frag{background:var(--panel-2);border:1px solid var(--edge-bright);border-radius:var(--r);padding:3px 8px}
  .tray .frag .k{color:var(--amber)}

  /* composer */
  .composer{border-top:1px solid var(--edge);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
  .composer textarea{
    width:100%;resize:vertical;min-height:52px;max-height:200px;
    background:var(--bg);border:1px solid var(--edge-bright);border-radius:var(--r);
    color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 12px;line-height:1.5
  }
  .composer textarea:focus{outline:none;border-color:var(--amber)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{
    cursor:pointer;border:1px solid var(--edge-bright);background:var(--panel);color:var(--text);
    border-radius:var(--r);padding:9px 14px;font-size:13px;font-weight:500;transition:.12s
  }
  .btn:hover{border-color:var(--steel)}
  .btn.primary{background:var(--amber);color:#1a1205;border-color:var(--amber);font-weight:700}
  .btn.primary:hover{box-shadow:0 0 18px rgba(255,178,36,.4)}
  .btn.primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:transparent;color:var(--steel)}
  .btn.danger:hover{border-color:var(--fault);color:var(--fault)}
  .spacer{flex:1}

  /* briefing / hint drawer */
  .drawer{border-top:1px solid var(--edge);background:#10171d}
  .drawer summary{cursor:pointer;padding:10px 16px;font-family:var(--mono);font-size:12px;color:var(--amber);
    list-style:none;display:flex;gap:8px;align-items:center}
  .drawer summary::-webkit-details-marker{display:none}
  .drawer .body{padding:0 16px 14px;font-size:13px;color:var(--text-dim);line-height:1.6;max-width:72ch}
  .drawer .body .lesson{margin-top:10px;padding-top:10px;border-top:1px dashed var(--edge);color:var(--steel)}

  /* leaderboard modal */
  .overlay{position:fixed;inset:0;background:rgba(5,8,10,.78);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--edge-bright);border-radius:var(--r);max-width:440px;width:100%;overflow:hidden}
  .modal .mh{padding:14px 18px;border-bottom:1px solid var(--edge);display:flex;align-items:center}
  .modal .mh h3{margin:0;font-weight:500;font-size:16px}
  .modal table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
  .modal td,.modal th{padding:9px 18px;text-align:left;border-bottom:1px solid var(--edge)}
  .modal th{color:var(--steel-dim);font-weight:500;font-size:11px}
  .modal td.num{text-align:right;color:var(--phosphor)}

  /* gate */
  .gate{max-width:420px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:26px}
  .gate h2{margin:0 0 4px;font-weight:500}
  .gate p{color:var(--text-dim);font-size:13px;margin:0 0 18px;line-height:1.5}
  .gate input{width:100%;background:var(--bg);border:1px solid var(--edge-bright);border-radius:var(--r);
    color:var(--text);font-family:var(--mono);padding:11px 12px;font-size:14px;margin-bottom:12px}
  .gate input:focus{outline:none;border-color:var(--amber)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;
    font-family:var(--mono);font-size:12.5px;padding:10px 16px;border-radius:var(--r);
    background:var(--panel);border:1px solid var(--edge-bright);color:var(--text)}
  .toast.good{border-color:var(--phosphor);color:var(--phosphor)}
  .toast.bad{border-color:var(--fault);color:#ffc9c4}
</style>
</head>
<body>
<div id="root">
  <noscript style="display:block;padding:40px;font-family:monospace;color:#dfe8ef">
    VOLT needs JavaScript enabled.
  </noscript>
</div>
<div id="cdn-fallback" style="display:none;max-width:560px;margin:14vh auto;padding:26px;
  font-family:'JetBrains Mono',monospace;color:#ffc9c4;background:#141b22;border:1px solid #ff5d52;border-radius:4px;line-height:1.6">
  <b style="color:#ffb224">Frontend libraries didn't load.</b><br/>
  This page pulls React &amp; Babel from a CDN (unpkg.com). If you're offline or
  behind a strict network, download those three files into <code>static/vendor/</code>
  and point the script tags at them — see the README's “offline frontend” note.
</div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // If the CDN didn't deliver React/Babel, surface a helpful message.
  window.addEventListener("load", function () {
    if (!window.React || !window.ReactDOM || !window.Babel) {
      document.getElementById("cdn-fallback").style.display = "block";
    }
  });
</script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
